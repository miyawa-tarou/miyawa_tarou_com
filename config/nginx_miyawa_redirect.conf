# 旧ドメイン miyawa-tarou.com -> miyawa.dojin-music.info 転送専用
# 証明書は旧ドメインのものを redirect 用に維持すること(certbot の更新を止めない)
server {
    listen 80;
    server_name miyawa-tarou.com www.miyawa-tarou.com;
    return 301 https://miyawa.dojin-music.info$request_uri;
}

server {
    listen 443 ssl;
    server_name miyawa-tarou.com www.miyawa-tarou.com;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/miyawa_redirect.access.log;
    error_log /var/log/nginx/miyawa_redirect.error.log;

    # www も含む証明書が必要: certbot -d miyawa-tarou.com -d www.miyawa-tarou.com -d blog.miyawa-tarou.com
    ssl_certificate /etc/letsencrypt/live/miyawa-tarou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miyawa-tarou.com/privkey.pem;

    return 301 https://miyawa.dojin-music.info$request_uri;
}

# blog.miyawa-tarou.com -> miyawa.dojin-music.info/blog
# 証明書に blog.miyawa-tarou.com を含めること(上記 certbot コマンド参照)
server {
    listen 80;
    server_name blog.miyawa-tarou.com;
    return 301 https://miyawa.dojin-music.info/blog$request_uri;
}

server {
    listen 443 ssl;
    server_name blog.miyawa-tarou.com;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/miyawa_redirect.access.log;
    error_log /var/log/nginx/miyawa_redirect.error.log;

    ssl_certificate /etc/letsencrypt/live/miyawa-tarou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miyawa-tarou.com/privkey.pem;

    return 301 https://miyawa.dojin-music.info/blog$request_uri;
}
