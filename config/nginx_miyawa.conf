server {
    listen 80;
    server_name miyawa.dojin-music.info;
    return 301 https://miyawa.dojin-music.info$request_uri;
}

server {
    listen 443 ssl;
    server_name miyawa.dojin-music.info;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/miyawa.access.log;
    error_log /var/log/nginx/miyawa.error.log;

    ssl_certificate /etc/letsencrypt/live/miyawa.dojin-music.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miyawa.dojin-music.info/privkey.pem;

    root /var/www/miyawa;
    index index.html;

    # WordPress ブログ: https://miyawa.dojin-music.info/blog/
    # ^~ は下のグローバルな PHP location より優先させるために必要
    location ^~ /blog/ {
        alias /var/www/miyawa_blog/wordpress/;
        index index.php index.html;
        try_files $uri $uri/ /blog/index.php?$args;

        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php8.5-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            include fastcgi_params;
        }
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
